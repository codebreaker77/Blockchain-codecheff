name: Blockchain verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Contract state and escrow tests
        run: npm test
      - name: Prepare execution sandbox
        run: docker pull python:3.12-alpine
      - name: Sandbox abuse tests
        run: npm run test:sandbox
      - name: Start local application
        run: |
          node scripts/start.mjs > stack.log 2>&1 &
          echo $! > stack.pid
          node scripts/wait-ready.mjs
      - name: Signed submissions, primary quorum, appeal, payout
        run: npm run demo
      - name: Production frontend build
        run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Browser tooling
        run: |
          python -m pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Desktop and mobile wallet flows
        run: python test/browser.py
      - name: Dependency advisories
        run: npm audit --audit-level=moderate
      - name: Diagnostics
        if: failure()
        run: |
          cat stack.log
          tail -n 40 test-results/verifier-*.log
      - name: Stop local application
        if: always()
        run: |
          if [ -f stack.pid ]; then kill "$(cat stack.pid)" || true; fi
